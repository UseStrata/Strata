# CI: bootstrap + test the compiler on Windows, macOS and Linux.
#
# Windows bootstraps from the pinned release (compiler/bootstrap.txt) and writes the C
# seed. macOS and Linux bootstrap from THAT seed (so they test the current sources even
# before a seed is committed) and run the same checks (tests/run.sh).
#
# On a push to main, if compiler/seed/VERSION isn't the compiler's version yet (a version
# bump, or no seed at all), the Windows job commits the new seed to main: one seed per
# version, made by a compiler that built itself (the fixpoint).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write    # the seed commit

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          path-type: inherit
      - name: put MinGW gcc on PATH
        shell: pwsh
        run: echo "${{ runner.temp }}\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: bootstrap + seed
        run: powershell -ExecutionPolicy Bypass -File compiler\build.ps1 -WriteSeed
      - uses: actions/upload-artifact@v4
        with:
          name: seed
          path: compiler/seed/
      - name: commit the seed (new version)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          new=$(cat compiler/seed/VERSION)
          old=$(git show HEAD:compiler/seed/VERSION 2>/dev/null || true)
          if [ "$new" = "$old" ]; then echo "seed for $new already committed"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compiler/seed
          git commit -m "seed: stratac $new as C (made by CI on Windows)"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: tests
        run: powershell -ExecutionPolicy Bypass -File compiler\tests\run.ps1

  posix:
    needs: windows
    if: ${{ always() && needs.windows.result != 'cancelled' }}   # run even if Windows tests fail
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: seed
          path: compiler/seed/
      - name: X11 headers (crossplatform.h's Window section, test projects)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev
      - name: bootstrap from the seed + tests
        run: sh compiler/tests/run.sh
