# CI: bootstrap + test the compiler on Windows, macOS (ARM64) and Linux (x86-64).
#
# Each OS bootstraps natively from the pinned release for it (compiler/bootstrap.txt):
# build.ps1 on Windows, build.sh on macOS / Linux, then runs the checks (tests/run.ps1,
# tests/run.sh). The Windows job also cross-compiles the compiler for Linux and macOS;
# those jobs check it equals the compiler they built themselves (the release archives
# for Linux and macOS are made that way, on Windows).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          path-type: inherit
      - name: put MinGW gcc on PATH (only for the tests' C host programs and the GNU as comparison)
        shell: pwsh
        run: echo "${{ runner.temp }}\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: bootstrap
        run: powershell -ExecutionPolicy Bypass -File compiler\build.ps1
      - name: cross-compile the compiler for Linux and macOS (checked against their own builds below)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force compiler/build/cross | Out-Null
          foreach ($t in "linux-x64", "macos-arm64") {
              & compiler/bin/stratac.exe build compiler/src/stratac.strata --target $t --force
              if ($LASTEXITCODE -ne 0) { exit 1 }
              Copy-Item compiler/src/stratac "compiler/build/cross/stratac-$t"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: cross
          path: compiler/build/cross/
      - name: tests
        run: powershell -ExecutionPolicy Bypass -File compiler\tests\run.ps1

  posix:
    needs: windows
    if: ${{ always() && needs.windows.result != 'cancelled' }}   # run even if Windows tests fail
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Xvfb + xdotool (CrossPlatform's window, on a virtual X server)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xdotool
      - uses: actions/download-artifact@v4
        with:
          name: cross
          path: compiler/build/cross/
      - name: bootstrap + tests
        run: sh compiler/tests/run.sh
      - name: the compiler Windows cross-compiles for this OS is the one this OS builds natively
        run: |
          t=linux-x64
          if [ "$(uname -s)" = Darwin ]; then t=macos-arm64; fi
          cmp compiler/bin/stratac compiler/build/cross/stratac-$t
          echo "PASS: compiler/bin/stratac (built here, natively) == the $t compiler built on Windows"
