# a project with per-platform libraries and a module in a subfolder
[project]
name  = "native"
entry = "src/main.strata"

[windows]
libs = ["winmm"]     # timeGetTime; not linked by default, so this proves the section applies

[linux]
libs = ["X11"]       # must be ignored on Windows (linking it would fail there)

[macos]
frameworks = ["Cocoa"]
